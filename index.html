<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Ligi Pro: Kukaba & Scoreboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1a3c1a; color: white; text-align: center; margin: 0; overflow: hidden; }
        
        /* Ubao wa Matokeo wa Kisasa (TV Style) */
        .scoreboard-container {
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            border-bottom: 3px solid #f1c40f;
        }
        .team-box { padding: 5px 15px; font-weight: bold; font-size: 20px; border-radius: 5px; }
        .score-live { background: #000; padding: 5px 20px; font-size: 24px; color: #f1c40f; margin: 0 10px; border: 1px solid #444; }
        .timer-box { font-size: 20px; margin-left: 20px; color: #ff4757; font-weight: bold; }

        canvas { background-color: #27ae60; border: 5px solid #fff; display: block; margin: 10px auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        .ad-link { display: block; padding: 10px; color: #ffeb3b; text-decoration: none; font-weight: bold; background: #c0392b; }

        #setup { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                 background: rgba(0,0,0,0.95); padding: 30px; border-radius: 15px; width: 350px; border: 3px solid #f1c40f; z-index: 100; }
        input, select { padding: 12px; width: 90%; margin: 10px 0; border-radius: 5px; font-size: 16px; }
        button { background: #f1c40f; padding: 12px 30px; border: none; font-weight: bold; cursor: pointer; font-size: 18px; border-radius: 5px; width: 100%; }
        
        .hint { color: #ccc; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <a href="https://oddlystudent.com/tu1ixct1?key=bf9ebe5967e8fa09c93394892db398f0" target="_blank" class="ad-link">
        🔥 BOFYA HAPA: PATA ZAWADI ZA MB NA VOCHA! 🔥
    </a>

    <div class="scoreboard-container" id="score-ui" style="display: none;">
        <div class="team-box" id="ui-my-team" style="background: #2980b9;">YANGA</div>
        <div class="score-live" id="live-score">0 - 0</div>
        <div class="team-box" id="ui-opp-team" style="background: #c0392b;">SIMBA</div>
        <div class="timer-box" id="ui-timer">01:00</div>
    </div>

    <div id="setup">
        <h2>🏆 Super Ligi Pro</h2>
        <input type="text" id="playerName" placeholder="Jina lako (mf. Maxi, Chama)">
        <select id="myTeamSelect">
            <option value="YANGA SC">YANGA SC</option>
            <option value="SIMBA SC">SIMBA SC</option>
            <option value="AZAM FC">AZAM FC</option>
            <option value="T. STARS">TAIFA STARS</option>
            <option value="BARCA">BARCELONA</option>
        </select>
        <p>DHIDI YA</p>
        <select id="oppTeamSelect">
            <option value="SIMBA SC">SIMBA SC</option>
            <option value="YANGA SC">YANGA SC</option>
            <option value="CHELSEA">CHELSEA</option>
            <option value="LIVERPOOL">LIVERPOOL</option>
        </select>
        <button onclick="startGame()">ANZA MECHI</button>
        <div class="hint">KUKABA: Sogelea adui | SHUTI: Space | TEMBEA: Arrows</div>
    </div>

    <canvas id="field"></canvas>

    <script>
        const canvas = document.getElementById('field');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 400;

        let gameRunning = false;
        let timeLeft = 60;
        let myScore = 0;
        let oppScore = 0;
        let myTeamName = "";
        let oppTeamName = "";

        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        let ball = { x: 400, y: 200, vx: 0, vy: 0, radius: 7 };
        let player = { x: 150, y: 200, speed: 4.5, size: 14, name: "" };
        let opponents = [
            { x: 600, y: 100, speed: 2.2 },
            { x: 600, y: 300, speed: 2.2 },
            { x: 760, y: 200, speed: 1.5, isGK: true }
        ];

        function startGame() {
            player.name = document.getElementById('playerName').value || "Star";
            myTeamName = document.getElementById('myTeamSelect').value;
            oppTeamName = document.getElementById('oppTeamSelect').value;

            document.getElementById('ui-my-team').innerText = myTeamName;
            document.getElementById('ui-opp-team').innerText = oppTeamName;
            
            document.getElementById('setup').style.display = "none";
            document.getElementById('score-ui').style.display = "flex";
            gameRunning = true;
            
            setInterval(() => {
                if(timeLeft > 0 && gameRunning) {
                    timeLeft--;
                    let mins = Math.floor(timeLeft / 60);
                    let secs = timeLeft % 60;
                    document.getElementById('ui-timer').innerText = 
                        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                } else if (timeLeft === 0 && gameRunning) {
                    gameRunning = false;
                    alert(`MPIRA UMEISHA!\n${myTeamName} ${myScore} - ${oppScore} ${oppTeamName}\n\nChangia kukuza game: 0627962633`);
                    location.reload();
                }
            }, 1000);

            update();
        }

        function update() {
            if(!gameRunning) return;

            // Kontroli za Mchezaji
            if(keys['ArrowUp'] && player.y > 15) player.y -= player.speed;
            if(keys['ArrowDown'] && player.y < canvas.height - 15) player.y += player.speed;
            if(keys['ArrowLeft'] && player.x > 15) player.x -= player.speed;
            if(keys['ArrowRight'] && player.x < canvas.width - 15) player.x += player.speed;

            // Physics ya Mpira
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.vx *= 0.985;
            ball.vy *= 0.985;

            // KUKABA NA KUCHENGA (Player)
            let distToBall = Math.hypot(ball.x - player.x, ball.y - player.y);
            if(distToBall < 25) {
                // Mpira unakaa mbele ya mchezaji (Dribbling)
                ball.vx = (ball.x - player.x) * 0.3;
                ball.vy = (ball.y - player.y) * 0.3;
                
                // PIGA SHUTI
                if(keys['Space']) {
                    ball.vx = 18; // Shuti la nguvu
                    ball.vy = (Math.random() - 0.5) * 6;
                }
            }

            // AI YA WAPINZANI (Kukaba)
            opponents.forEach(opp => {
                let distOppToBall = Math.hypot(ball.x - opp.x, ball.y - opp.y);
                
                // Mpinzani anakufuata au anafuata mpira
                let targetX = ball.x;
                let targetY = ball.y;
                
                let dx = targetX - opp.x;
                let dy = targetY - opp.y;
                let angle = Math.atan2(dy, dx);
                
                opp.x += Math.cos(angle) * opp.speed;
                opp.y += Math.sin(angle) * opp.speed;

                // Mpinzani akikaba (Anapiga mpira kuelekea goli lako)
                if(distOppToBall < 18) {
                    ball.vx = -7;
                    ball.vy = (Math.random() - 0.5) * 8;
                }
            });

            // GOLI KULIA (Unashambulia)
            if(ball.x > canvas.width - 15 && ball.y > 140 && ball.y < 260) {
                myScore++;
                resetBall();
            }
            // GOLI KUSHOTO (Unashambuliwa)
            if(ball.x < 15 && ball.y > 140 && ball.y < 260) {
                oppScore++;
                resetBall();
            }

            // Mipaka
            if(ball.y < 10 || ball.y > canvas.height - 10) ball.vy *= -1;
            if(ball.x < 10 || ball.x > canvas.width - 10) ball.vx *= -1;

            document.getElementById('live-score').innerText = `${myScore} - ${oppScore}`;
            
            draw();
            requestAnimationFrame(update);
        }

        function resetBall() {
            ball.x = 400; ball.y = 200; ball.vx = 0; ball.vy = 0;
            player.x = 150; player.y = 200;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Uwanja Lines
            ctx.strokeStyle = "rgba(255,255,255,0.6)";
            ctx.lineWidth = 3;
            ctx.strokeRect(10, 10, canvas.width-20, canvas.height-20);
            ctx.beginPath(); ctx.moveTo(400,10); ctx.lineTo(400,390); ctx.stroke();
            ctx.beginPath(); ctx.arc(400, 200, 50, 0, Math.PI*2); ctx.stroke();
            
            // Magoli (Boxes)
            ctx.strokeRect(10, 120, 60, 160);
            ctx.strokeRect(730, 120, 60, 160);

            // Mpira
            ctx.shadowBlur = 10; ctx.shadowColor = "black";
            ctx.fillStyle = "white";
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            // Player (Wewe)
            ctx.fillStyle = "#f1c40f"; // Njano/Gold
            ctx.beginPath(); ctx.arc(player.x, player.y, player.size, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "white";
            ctx.font = "bold 12px Arial";
            ctx.fillText(player.name, player.x - 15, player.y - 20);

            // Maadui
            ctx.fillStyle = "#e74c3c";
            opponents.forEach(opp => {
                ctx.beginPath(); ctx.arc(opp.x, opp.y, 14, 0, Math.PI*2); ctx.fill();
                if(opp.isGK) {
                    ctx.fillStyle = "black";
                    ctx.fillText("GK", opp.x - 8, opp.y + 5);
                    ctx.fillStyle = "#e74c3c";
                }
            });
        }
    </script>
</body>
</html>
