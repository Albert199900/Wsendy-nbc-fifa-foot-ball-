<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Ligi: Bongo vs Ulaya</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2e8b57;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background-color: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
        }
        h1 { color: #f1c40f; margin-bottom: 5px; }
        
        /* Staili mpya ya Tangazo ili ivutie kubofya */
        .adsterra-banner {
            background-color: #ffeb3b;
            color: #d35400;
            padding: 15px;
            margin: 0 auto 20px auto;
            border-radius: 8px;
            border: 2px dashed #e67e22;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            animation: pulse 2s infinite; /* Inafanya tangazo limweke kuvutia macho */
        }
        .adsterra-banner:hover {
            background-color: #f1c40f;
            transform: scale(1.02);
            transition: 0.3s;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(230, 126, 34, 0); }
            100% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0); }
        }

        select {
            font-size: 18px;
            padding: 10px;
            margin: 15px 5px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        .vs { font-size: 24px; font-weight: bold; color: #e74c3c; }
        
        button {
            font-size: 20px;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            margin: 5px;
        }
        .play-btn { background-color: #f1c40f; color: #111; width: 100%; margin-top: 20px; }
        .play-btn:hover { background-color: #d4ac0d; transform: scale(1.02); }
        
        #result {
            margin-top: 25px;
            background-color: #fff;
            color: #111;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        .score { font-size: 36px; font-weight: bold; color: #2c3e50; }
        .winner { font-size: 20px; margin-top: 10px; font-weight: bold; }

        .action-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 10px;
        }
        .donate-btn { background-color: #27ae60; color: white; font-size: 16px; flex: 1; }
        .share-btn { background-color: #2980b9; color: white; font-size: 16px; flex: 1; }
        .donate-btn:hover { background-color: #2ecc71; }
        .share-btn:hover { background-color: #3498db; }
    </style>
</head>
<body>

    <div class="container">
        
        <a href="https://oddlystudent.com/tu1ixct1?key=bf9ebe5967e8fa09c93394892db398f0" target="_blank" style="text-decoration: none;">
            <div class="adsterra-banner">
                🎁 BONYEZA HAPA KUPATA OFA MAALUM YA LEO! 🎁<br>
                <span style="font-size: 12px; font-weight: normal; color: #333;">(Tangazo)</span>
            </div>
        </a>
        <h1>🏆 Super Ligi Simulator</h1>
        <p>Panga mechi kati ya miamba ya soka!</p>
        
        <div>
            <select id="team1"></select>
            <span class="vs"> VS </span>
            <select id="team2"></select>
        </div>
        
        <button class="play-btn" onclick="playMatch()">⚽ Cheza Mechi!</button>
        
        <div id="result">
            <div class="score" id="scoreDisplay">0 - 0</div>
            <div class="winner" id="winnerText"></div>
        </div>

        <div class="action-buttons">
            <button class="donate-btn" onclick="showDonate()">💰 Changia (Support)</button>
            <button class="share-btn" onclick="shareGame()">🔗 Share na Wana</button>
        </div>
    </div>

    <script>
        const teams = [
            "Yanga SC", "Simba SC", "Taifa Stars", "Azam FC", 
            "Singida", "TRA FC", "Namungo FC", "Barcelona", 
            "Chelsea", "Bayern Munich", "Liverpool", "AS Roma"
        ];

        const team1Select = document.getElementById("team1");
        const team2Select = document.getElementById("team2");

        teams.forEach(team => {
            team1Select.add(new Option(team, team));
            team2Select.add(new Option(team, team));
        });

        team2Select.selectedIndex = 1;

        function playMatch() {
            let t1 = team1Select.value;
            let t2 = team2Select.value;
            let resultDiv = document.getElementById("result");
            let scoreDisplay = document.getElementById("scoreDisplay");
            let winnerText = document.getElementById("winnerText");

            if (t1 === t2) {
                alert("⚠ Tafadhali chagua timu mbili tofauti!");
                return;
            }

            let goals1 = Math.floor(Math.random() * 5);
            let goals2 = Math.floor(Math.random() * 5);

            scoreDisplay.innerHTML = `${t1} <b>${goals1} - ${goals2}</b> ${t2}`;

            if (goals1 > goals2) {
                winnerText.innerHTML = `🎉 Mshindi ni ${t1}!`;
                winnerText.style.color = "#27ae60"; 
            } else if (goals2 > goals1) {
                winnerText.innerHTML = `🎉 Mshindi ni ${t2}!`;
                winnerText.style.color = "#27ae60"; 
            } else {
                winnerText.innerHTML = "🤝 Mechi imeisha kwa Sare (Ngoma Droo)!";
                winnerText.style.color = "#e67e22"; 
            }

            resultDiv.style.display = "block";
        }

        function showDonate() {
            alert("Asante kwa kusapoti! Ili game iendelee kuwa hewani, unaweza kutuma mchango wako kupitia:\n\nLipa Namba (M-Pesa): 1234567\nJina: Jina Lako Hapa");
        }

        function shareGame() {
            if (navigator.share) {
                navigator.share({
                    title: 'Super Ligi Simulator',
                    text: 'Njoo ucheze game hii ya kupanga mechi za Bongo vs Ulaya!',
                    url: window.location.href
                }).catch(console.error);
            } else {
                alert("Nakili link hii na uwasambazie washkaji WhatsApp: " + window.location.href);
            }
        }
    </script>

</body>
</html>
